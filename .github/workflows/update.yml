name: IPTV 自动更新

on:
  schedule:
    # 每 4 小时整点执行（UTC）。cron 用 UTC，4 小时一次不受时区影响。
    - cron: "0 */4 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - "tvbox.json"

permissions:
  contents: write

concurrency:
  group: iptv-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 采集并测活直播源
        run: python scripts/update.py

      - name: 回写结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs data
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 自动更新直播源 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
